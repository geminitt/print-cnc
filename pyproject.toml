[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "print-cvc"
version = "0.1.0"
description = "JPG boundary preparation and read-only XY plotter monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<14"]

[project.scripts]
xy-plotter = "plotter.__main__:main"

[tool.setuptools.packages.find]
include = ["plotter*"]

[tool.setuptools.package-data]
plotter = ["profiles/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
