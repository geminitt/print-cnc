[workspace]
name = "print-cnc"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
pillow = ">=11,<14"
tk = "8.6.*"
ruff = ">=0.12,<1"

[tasks]
test = "python -m unittest discover -s tests -v"
lint = "ruff check plotter tests"
demo = "python -m plotter demo"
